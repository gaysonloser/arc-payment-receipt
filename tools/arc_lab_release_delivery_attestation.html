<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release Delivery Attestation</title><style>body{max-width:880px;margin:48px auto;padding:0 20px;background:#07111f;color:#e5eef8;font:16px/1.55 system-ui,sans-serif}h1{margin-bottom:0}small{color:#91a4ba}dl{display:grid;grid-template-columns:190px 1fr;gap:10px 18px;padding:20px;background:#101f33;border-radius:12px}dt{color:#9fb4cc}dd{margin:0;overflow-wrap:anywhere}code{color:#c5f2dc}.ok{color:#69d391}.boundary{border-left:4px solid #ffca6a;padding-left:14px}</style></head><body><h1>Release Delivery Attestation</h1><p>Read-only verification of a completed five-surface release bundle.</p><small id="state">Loading bounded attestation…</small><dl id="facts"></dl><p class="boundary">This view cannot sign, deploy, import contracts, create webhooks, submit to Encode, or write to ERP.</p><script>const facts=document.querySelector('#facts'),state=document.querySelector('#state');fetch('/api/v1/release-delivery-attestation').then(r=>r.json()).then(p=>{const rows=[['Publication unit',p.attested_release.publication_unit_id],['Release fingerprint',p.attested_release.release_fingerprint_sha256],['Bundle status',p.verification.bundle_complete?'Complete':'Incomplete'],...Object.entries(p.receipts)];facts.innerHTML=rows.map(([k,v])=>`<dt>${k}</dt><dd><code class="${k==='Bundle status'&&v==='Complete'?'ok':''}">${v}</code></dd>`).join('');state.textContent='Bounded public attestation loaded.'}).catch(e=>state.textContent=`Unavailable: ${e.message}`)</script></body></html>
