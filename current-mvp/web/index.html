<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F6F8">
  <meta name="description" content="Arc Enterprise Settlement & Cash Control local A12 workbench fixture">
  <title>Arc Enterprise · Settlement Workbench</title>
  <style>
    :root {
      --asc-l0: #F4F6F8;
      --asc-l1: #FFFFFF;
      --asc-l2: #EEF4FF;
      --asc-l3: #FFFFFF;
      --asc-text: #172033;
      --asc-secondary: #526071;
      --asc-muted: #718096;
      --asc-border: #CDD5DF;
      --asc-selected: #DCE9FF;
      --asc-focus: #145DCC;
      --asc-success: #147D64;
      --asc-warning: #9A6700;
      --asc-danger: #B42318;
      --asc-stale: #8A5A00;
      --asc-shadow-1: 0 1px 2px rgba(23, 32, 51, .06);
      --asc-shadow-2: 0 8px 24px rgba(23, 32, 51, .10);
      --asc-radius-object: 6px;
      --asc-radius-panel: 8px;
      --asc-radius-dialog: 12px;
      --asc-space-1: 4px;
      --asc-space-2: 8px;
      --asc-space-3: 12px;
      --asc-space-4: 16px;
      --asc-space-5: 20px;
      --asc-space-6: 24px;
      --asc-space-7: 32px;
      --asc-nav: 208px;
      --asc-queue: 300px;
      --asc-inspector: 336px;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--asc-l0); }
    body { margin: 0; min-width: 320px; background: var(--asc-l0); color: var(--asc-text); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.45; }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, dialog:focus-visible { outline: 3px solid var(--asc-focus); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .56; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 24px; line-height: 1.2; letter-spacing: -.015em; }
    h2 { font-size: 16px; line-height: 1.25; }
    h3 { font-size: 14px; line-height: 1.35; }
    small { color: var(--asc-secondary); font-size: 12px; line-height: 1.4; }
    code { border: 1px solid var(--asc-border); border-radius: var(--asc-radius-object); background: var(--asc-l0); padding: 2px 4px; font-size: 12px; }

    .asc-app { display: grid; grid-template-columns: var(--asc-nav) var(--asc-queue) minmax(0, 1fr) var(--asc-inspector); grid-template-rows: 68px minmax(0, 1fr); min-height: 100vh; background: var(--asc-l0); }
    .asc-global-shell { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--asc-space-6); min-height: 68px; padding: 0 var(--asc-space-6); border-bottom: 1px solid var(--asc-border); background: var(--asc-l1); box-shadow: var(--asc-shadow-1); z-index: 5; }
    .asc-brand-lockup { display: flex; align-items: center; gap: var(--asc-space-3); flex: 0 0 var(--asc-nav); }
    .asc-brand-lockup > div { display: grid; gap: 1px; }
    .asc-brand-lockup strong { font-size: 14px; }
    .asc-brand-lockup small { font-size: 11px; color: var(--asc-muted); }
    .asc-brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid #9EB8E8; border-radius: var(--asc-radius-object); background: var(--asc-l2); color: #164C9B; font-weight: 750; }
    .asc-global-nav { display: flex; align-items: stretch; align-self: stretch; gap: var(--asc-space-1); }
    .asc-nav-item { display: inline-flex; align-items: center; gap: var(--asc-space-2); min-width: 108px; padding: 0 var(--asc-space-4); border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--asc-secondary); cursor: pointer; font-weight: 650; }
    .asc-nav-item:hover, .asc-nav-item.is-active { background: var(--asc-l2); color: var(--asc-text); border-bottom-color: var(--asc-focus); }
    .asc-environment { display: grid; gap: 0; margin-left: auto; padding-left: var(--asc-space-5); border-left: 1px solid var(--asc-border); min-width: 170px; }
    .asc-environment strong { font-size: 13px; color: var(--asc-stale); }
    .asc-guide { display: inline-flex; align-items: center; gap: var(--asc-space-2); padding-left: var(--asc-space-5); border-left: 1px solid var(--asc-border); color: var(--asc-secondary); white-space: nowrap; }
    .asc-guide-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--asc-warning); }
    .asc-icon-button { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; padding: 0; border: 1px solid var(--asc-border); border-radius: 999px; background: var(--asc-l1); cursor: pointer; font-weight: 700; }
    .asc-icon-button:hover { background: var(--asc-l2); }

    .asc-queue { grid-column: 2; min-width: 0; min-height: calc(100vh - 68px); padding: var(--asc-space-5) var(--asc-space-4); border-right: 1px solid var(--asc-border); background: var(--asc-l1); overflow: auto; }
    .asc-queue-head, .asc-panel-head, .asc-inspector-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--asc-space-3); }
    .asc-queue-head { align-items: center; margin-bottom: var(--asc-space-4); }
    .asc-queue-head h2 { margin-top: 2px; }
    .asc-count { display: grid; place-items: center; min-width: 28px; height: 24px; border: 1px solid var(--asc-border); border-radius: 999px; background: var(--asc-l0); color: var(--asc-secondary); font-size: 12px; font-weight: 700; }
    .asc-eyebrow { display: block; color: var(--asc-muted); font-size: 11px; letter-spacing: .08em; line-height: 1.3; text-transform: uppercase; }
    .asc-search-label { display: block; margin-bottom: var(--asc-space-2); color: var(--asc-secondary); font-size: 12px; font-weight: 650; }
    .asc-input { width: 100%; min-height: 44px; padding: 0 var(--asc-space-3); border: 1px solid var(--asc-border); border-radius: var(--asc-radius-object); background: var(--asc-l1); color: var(--asc-text); }
    .asc-input::placeholder { color: #8793A3; }
    .asc-queue-filters { display: flex; gap: var(--asc-space-2); margin: var(--asc-space-3) 0; }
    .asc-filter { min-height: 32px; padding: 0 var(--asc-space-3); border: 1px solid var(--asc-border); border-radius: 999px; background: var(--asc-l1); color: var(--asc-secondary); cursor: pointer; font-size: 12px; }
    .asc-filter.is-active { border-color: #9EB8E8; background: var(--asc-selected); color: #164C9B; font-weight: 700; }
    .asc-queue-list { display: grid; gap: var(--asc-space-2); }
    .asc-queue-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); grid-template-rows: auto auto; align-items: center; gap: 0 var(--asc-space-2); width: 100%; min-height: 68px; padding: var(--asc-space-2); border: 1px solid transparent; border-radius: var(--asc-radius-object); background: transparent; text-align: left; cursor: pointer; }
    .asc-queue-row:hover { background: var(--asc-l2); }
    .asc-queue-row.is-selected { border-color: #9EB8E8; background: var(--asc-selected); box-shadow: var(--asc-shadow-1); }
    .asc-queue-index { grid-row: 1 / 3; align-self: start; padding-top: 2px; color: var(--asc-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .asc-queue-copy { display: grid; min-width: 0; gap: 2px; }
    .asc-queue-copy strong, .asc-queue-copy small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .asc-queue-copy strong { font-size: 13px; }
    .asc-queue-status { grid-column: 2; justify-self: start; margin-top: 2px; font-size: 11px; font-weight: 700; text-transform: capitalize; }
    .asc-state-success { color: var(--asc-success); }
    .asc-state-neutral { color: var(--asc-secondary); }
    .asc-state-danger { color: var(--asc-danger); }
    .asc-queue-foot { display: flex; gap: var(--asc-space-2); margin-top: var(--asc-space-5); padding-top: var(--asc-space-4); border-top: 1px solid var(--asc-border); color: var(--asc-muted); font-size: 11px; }
    .asc-dot { flex: 0 0 auto; width: 8px; height: 8px; margin-top: 5px; border-radius: 999px; }
    .asc-dot-blue { background: var(--asc-focus); }
    .asc-dot-amber { background: var(--asc-warning); }

    .asc-canvas { grid-column: 3; min-width: 0; min-height: calc(100vh - 68px); padding: var(--asc-space-6); overflow: auto; }
    .asc-canvas-head { display: flex; justify-content: space-between; gap: var(--asc-space-6); align-items: flex-start; max-width: 1040px; margin: 0 auto var(--asc-space-4); }
    .asc-subtitle { max-width: 720px; margin-top: var(--asc-space-2); color: var(--asc-secondary); }
    .asc-canvas-status { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--asc-space-2); max-width: 300px; }
    .asc-badge, .asc-truth { display: inline-flex; align-items: center; min-height: 24px; padding: 0 var(--asc-space-2); border: 1px solid var(--asc-border); border-radius: 999px; background: var(--asc-l1); color: var(--asc-secondary); font-size: 11px; font-weight: 700; white-space: nowrap; }
    .asc-badge-success { border-color: #9AD1C1; background: #ECF8F3; color: var(--asc-success); }
    .asc-badge-neutral { border-color: var(--asc-border); background: var(--asc-l1); color: var(--asc-secondary); }
    .asc-badge-danger { border-color: #F3B7B1; background: #FFF0EE; color: var(--asc-danger); }
    .asc-truth { border-color: #D8C795; background: #FFFBEB; color: var(--asc-stale); }
    .asc-identity-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; max-width: 1040px; margin: 0 auto var(--asc-space-4); border: 1px solid var(--asc-border); border-radius: var(--asc-radius-panel); background: var(--asc-border); overflow: hidden; box-shadow: var(--asc-shadow-1); }
    .asc-identity-strip > div { display: grid; gap: 2px; min-width: 0; padding: var(--asc-space-3); background: var(--asc-l1); }
    .asc-identity-strip span { color: var(--asc-muted); font-size: 11px; }
    .asc-identity-strip strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .asc-panel { max-width: 1040px; margin: 0 auto var(--asc-space-4); padding: var(--asc-space-5); border: 1px solid var(--asc-border); border-radius: var(--asc-radius-panel); background: var(--asc-l1); box-shadow: var(--asc-shadow-1); }
    .asc-panel-head { margin-bottom: var(--asc-space-4); }
    .asc-panel-head h2 { margin-top: 2px; }
    .asc-rail-note { color: var(--asc-muted); font-size: 12px; }
    .asc-causal-panel { background: var(--asc-l2); }
    .asc-causal-rail { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--asc-space-2); margin: 0; padding: 0; list-style: none; }
    .asc-causal-step { min-width: 0; }
    .asc-causal-step button { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: start; gap: var(--asc-space-2); width: 100%; min-height: 56px; padding: var(--asc-space-2); border: 1px solid var(--asc-border); border-radius: var(--asc-radius-object); background: var(--asc-l1); text-align: left; cursor: pointer; }
    .asc-causal-step button:hover, .asc-causal-step.is-current button { border-color: var(--asc-focus); background: #F9FBFF; }
    .asc-causal-step.is-complete button { border-color: #9AD1C1; }
    .asc-causal-step.is-blocked button { color: var(--asc-secondary); }
    .asc-causal-number { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 999px; background: var(--asc-selected); color: #164C9B; font-size: 11px; font-weight: 750; }
    .asc-causal-step strong, .asc-causal-step small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .asc-causal-step strong { font-size: 12px; }
    .asc-causal-step small { margin-top: 2px; color: var(--asc-secondary); font-size: 11px; }
    .asc-stop-condition { display: flex; gap: var(--asc-space-2); margin-top: var(--asc-space-3); padding-top: var(--asc-space-3); border-top: 1px solid #BFCDE3; color: var(--asc-secondary); font-size: 12px; }
    .asc-stop-condition strong { color: var(--asc-danger); white-space: nowrap; }
    .asc-field-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--asc-space-2); }
    .asc-field { min-width: 0; min-height: 74px; padding: var(--asc-space-3); border: 1px solid var(--asc-border); border-radius: var(--asc-radius-object); background: var(--asc-l1); }
    .asc-field-label, .asc-field strong, .asc-field small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .asc-field-label { color: var(--asc-muted); font-size: 11px; }
    .asc-field strong { margin: 3px 0; font-size: 13px; }
    .asc-field small { color: var(--asc-secondary); }
    .asc-provenance-dot { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 999px; background: var(--asc-focus); }
    .asc-panel-note { display: flex; gap: var(--asc-space-2); margin-top: var(--asc-space-4); padding: var(--asc-space-3); border-left: 3px solid var(--asc-focus); background: var(--asc-l2); color: var(--asc-secondary); font-size: 12px; }
    .asc-note-icon { display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid #9EB8E8; border-radius: 999px; color: #164C9B; font-weight: 750; }
    .asc-inline-meta { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: var(--asc-space-2); align-items: center; margin-bottom: var(--asc-space-3); color: var(--asc-muted); font-size: 11px; }
    .asc-inline-meta strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--asc-text); font-size: 12px; }
    .asc-table-wrap { overflow-x: auto; }
    .asc-table { width: 100%; border-collapse: collapse; min-width: 560px; }
    .asc-table caption { margin-bottom: var(--asc-space-2); color: var(--asc-muted); text-align: left; font-size: 11px; }
    .asc-table th, .asc-table td { padding: var(--asc-space-3) var(--asc-space-2); border-bottom: 1px solid var(--asc-border); text-align: left; vertical-align: middle; }
    .asc-table th { color: var(--asc-secondary); font-size: 11px; font-weight: 700; }
    .asc-table td { font-size: 12px; }
    .asc-empty { color: var(--asc-muted); text-align: center !important; }
    .asc-separation { display: grid; grid-template-columns: 1fr 1fr; gap: var(--asc-space-2); margin-top: var(--asc-space-4); }
    .asc-separation > div, .asc-ledger-card > div { display: grid; gap: 2px; padding: var(--asc-space-3); border: 1px solid var(--asc-border); border-radius: var(--asc-radius-object); background: var(--asc-l0); }
    .asc-separation span, .asc-ledger-card span { color: var(--asc-muted); font-size: 11px; }
    .asc-separation strong, .asc-ledger-card strong { font-size: 14px; }
    .asc-separation small, .asc-ledger-card small { color: var(--asc-secondary); font-size: 11px; }
    .asc-object-list { display: grid; gap: var(--asc-space-2); }
    .asc-object-row { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--asc-space-4); padding: var(--asc-space-3); border: 1px solid var(--asc-border); border-radius: var(--asc-radius-object); }
    .asc-object-row > div { min-width: 0; }
    .asc-object-row strong, .asc-object-row small { display: block; }
    .asc-object-row strong { font-size: 13px; }
    .asc-object-row small { margin-top: 2px; color: var(--asc-secondary); }
    .asc-object-state { flex: 0 0 auto; padding: 3px 7px; border-radius: 999px; background: var(--asc-l0); color: var(--asc-secondary); font-size: 11px; font-weight: 700; text-transform: capitalize; }
    .asc-object-ready, .asc-object-observed, .asc-object-projected { background: #ECF8F3; color: var(--asc-success); }
    .asc-object-missing, .asc-object-missing_required_input { background: #FFF0EE; color: var(--asc-danger); }
    .asc-object-not_applicable { background: var(--asc-l0); color: var(--asc-muted); }
    .asc-object-optional { background: #FFFBEB; color: var(--asc-stale); }
    .asc-command-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--asc-space-4); max-width: 1040px; margin: 0 auto var(--asc-space-4); padding: var(--asc-space-5); border: 1px solid #9EB8E8; border-radius: var(--asc-radius-panel); background: var(--asc-l2); }
    .asc-command-bar > div { display: grid; gap: 2px; }
    .asc-command-bar strong { font-size: 14px; }
    .asc-command-bar small { color: var(--asc-secondary); }
    .asc-primary-action { min-height: 48px; padding: 0 var(--asc-space-5); border: 1px solid #0D4B9F; border-radius: var(--asc-radius-object); background: #145DCC; color: #FFFFFF; cursor: pointer; font-weight: 750; }
    .asc-primary-action:hover:not(:disabled) { background: #0D4B9F; }
    .asc-command-boundary { grid-column: 1 / -1; color: var(--asc-secondary); font-size: 11px; }
    .asc-live-region { min-height: 20px; max-width: 1040px; margin: 0 auto; color: var(--asc-secondary); font-size: 12px; }

    .asc-inspector { grid-column: 4; min-width: 0; min-height: calc(100vh - 68px); padding: var(--asc-space-5); border-left: 1px solid var(--asc-border); background: var(--asc-l3); overflow: auto; }
    .asc-inspector-head h2 { margin-top: 2px; }
    .asc-inspector-close { display: none; }
    .asc-inspector-case { display: grid; gap: var(--asc-space-2); margin: var(--asc-space-4) 0; }
    .asc-inspector-case > span:first-child { color: var(--asc-secondary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; overflow-wrap: anywhere; }
    .asc-inspector-tabs { display: flex; gap: 0; overflow-x: auto; border-bottom: 1px solid var(--asc-border); }
    .asc-inspector-tab { min-width: 44px; min-height: 44px; padding: 0 var(--asc-space-2); border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--asc-secondary); cursor: pointer; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .asc-inspector-tab.is-active { border-bottom-color: var(--asc-focus); color: var(--asc-text); }
    .asc-inspector-body { padding: var(--asc-space-5) 0; }
    .asc-inspector-section { display: grid; gap: var(--asc-space-3); }
    .asc-inspector-section h3 { font-size: 16px; }
    .asc-definition-list { display: grid; gap: var(--asc-space-3); margin: 0; }
    .asc-definition-list > div { display: grid; gap: 2px; padding-bottom: var(--asc-space-3); border-bottom: 1px solid var(--asc-border); }
    .asc-definition-list dt { color: var(--asc-muted); font-size: 11px; }
    .asc-definition-list dd { margin: 0; color: var(--asc-text); font-size: 12px; overflow-wrap: anywhere; }
    .asc-mini-list { display: grid; gap: var(--asc-space-2); max-height: 520px; overflow: auto; }
    .asc-mini-list > div { display: grid; gap: 2px; padding: var(--asc-space-2); border: 1px solid var(--asc-border); border-radius: var(--asc-radius-object); }
    .asc-mini-list span, .asc-mini-list small { color: var(--asc-muted); font-size: 11px; }
    .asc-mini-list strong { font-size: 12px; overflow-wrap: anywhere; }
    .asc-warning-note { padding: var(--asc-space-3); border-left: 3px solid var(--asc-warning); background: #FFFBEB; color: var(--asc-stale); font-size: 12px; }
    .asc-ledger-card { display: grid; gap: var(--asc-space-2); }
    .asc-muted { color: var(--asc-muted); font-size: 12px; }
    .asc-inspector-footer { display: flex; gap: var(--asc-space-2); padding-top: var(--asc-space-4); border-top: 1px solid var(--asc-border); color: var(--asc-muted); font-size: 11px; }
    .asc-inspector-dialog { width: min(92vw, 520px); max-height: 88vh; padding: 0; border: 0; border-radius: var(--asc-radius-dialog); box-shadow: var(--asc-shadow-2); color: var(--asc-text); }
    .asc-inspector-dialog::backdrop { background: rgba(23, 32, 51, .35); }
    .asc-dialog-inner { padding: var(--asc-space-5); }
    .asc-dialog-content .asc-inspector { display: block; min-height: 0; padding: 0; border: 0; overflow: visible; }
    .asc-dialog-content .asc-inspector > .asc-inspector-head, .asc-dialog-content .asc-inspector > .asc-inspector-case, .asc-dialog-content .asc-inspector > .asc-inspector-footer { display: none; }

    @media (max-width: 1279px) {
      :root { --asc-nav: 80px; --asc-queue: 280px; --asc-inspector: 320px; }
      .asc-global-shell { gap: var(--asc-space-4); padding: 0 var(--asc-space-4); }
      .asc-brand-lockup { flex-basis: var(--asc-nav); }
      .asc-brand-lockup > div, .asc-nav-item span:last-child, .asc-environment small, .asc-guide span:not(.asc-guide-dot) { display: none; }
      .asc-nav-item { min-width: 44px; justify-content: center; padding: 0 var(--asc-space-2); }
      .asc-environment { min-width: auto; }
      .asc-canvas { padding: var(--asc-space-5); }
      .asc-field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 1023px) {
      :root { --asc-nav: 72px; --asc-queue: 260px; }
      .asc-app { grid-template-columns: var(--asc-nav) var(--asc-queue) minmax(0, 1fr); }
      .asc-inspector { display: none; }
      .asc-global-shell { gap: var(--asc-space-3); }
      .asc-brand-lockup { flex-basis: var(--asc-nav); }
      .asc-environment { margin-left: auto; }
      .asc-guide { border-left: 0; padding-left: 0; }
      .asc-canvas { padding: var(--asc-space-4); }
      .asc-causal-rail { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .asc-canvas-head { display: block; }
      .asc-canvas-status { justify-content: flex-start; margin-top: var(--asc-space-3); max-width: none; }
      .asc-inspector-dialog[open] { display: block; }
    }
    @media (max-width: 720px) {
      .asc-app { display: block; }
      .asc-global-shell { position: sticky; top: 0; min-height: 60px; }
      .asc-brand-lockup { flex: 1; }
      .asc-global-nav { display: none; }
      .asc-environment { display: none; }
      .asc-queue, .asc-canvas { min-height: auto; border: 0; }
